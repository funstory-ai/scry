[workspace]
members = [
  "crates/scry-proto",
  "crates/scry-storage",
  "crates/scry-index",
  "crates/scry-fuse",
  "crates/scryd",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
authors = ["scry contributors"]

[workspace.dependencies]
anyhow = "1"
async-stream = "0.3"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
hex = "0.4"
futures-core = "0.3"
hmac = "0.12"
prost = "0.13"
prost-types = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
blake3 = "1"
mime_guess = "2"
serde_yaml = "0.9"
sha2 = "0.10"
http = "1"
http-body-util = "0.1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "fs", "net"] }
tokio-stream = { version = "0.1", features = ["net"] }
tokio-postgres = "0.7"
tonic = { version = "0.12", features = ["transport", "tls"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
pin-project = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tempfile = "3"
uuid = { version = "1", features = ["v7", "serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
memmap2 = "0.9"
utf8parse = "0.2"
